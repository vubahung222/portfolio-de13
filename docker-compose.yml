services:
  # ---------------------------------------------------------
  #  MySQL Database
  # ---------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: portfolio_mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_EXPORTER_USER: ${MYSQL_EXPORTER_USER}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/02-create-exporter-user.sh:/docker-entrypoint-initdb.d/02-create-exporter-user.sh:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------
  #  phpMyAdmin (DB management tool)
  # ---------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: portfolio_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
      PMA_ABSOLUTE_URI: https://localhost/pma/
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend
      - frontend
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------
  #  PHP-FPM Application (portfolio + admin)
  # ---------------------------------------------------------
  app:
    build:
      context: ./app
    container_name: portfolio_app
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
    volumes:
      - ./app/public:/var/www/html/public:ro
      - ./app/src:/var/www/html/src:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------
  #  Nginx reverse proxy (HTTPS + security headers)
  # ---------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: portfolio_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./app/public:/var/www/html/public:ro
    depends_on:
      - app
      - phpmyadmin
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------
  #  Prometheus
  # ---------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: portfolio_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    user: "65534:65534"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    networks:
      - monitoring
      - backend
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------
  #  Grafana
  # ---------------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: portfolio_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring
      - frontend
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------
  #  cAdvisor (container metrics)
  # ---------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: portfolio_cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------
  #  Node exporter (host metrics)
  # ---------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: portfolio_node_exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------
  #  MySQL exporter (database metrics)
  # ---------------------------------------------------------
  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: portfolio_mysql_exporter
    restart: unless-stopped
    command:
      - --mysqld.username=${MYSQL_EXPORTER_USER}:${MYSQL_EXPORTER_PASSWORD}
      - --mysqld.address=mysql:3306
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend
      - monitoring
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------
  #  Nginx exporter (web server metrics via stub_status)
  # ---------------------------------------------------------
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: portfolio_nginx_exporter
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8080/stub_status
    depends_on:
      - nginx
    networks:
      - frontend
      - backend
      - monitoring
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------
  #  Loki (log aggregation)
  # ---------------------------------------------------------
  loki:
    image: grafana/loki:3.1.0
    container_name: portfolio_loki
    restart: unless-stopped
    user: "10001:10001"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------
  #  Promtail (log collector -> Loki)
  # ---------------------------------------------------------
  promtail:
    image: grafana/promtail:3.1.0
    container_name: portfolio_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true

# ------------------------------------------------------------
#  Networks (isolation: frontend / backend / monitoring)
# ------------------------------------------------------------
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  monitoring:
    driver: bridge

# ------------------------------------------------------------
#  Named volumes (persistent data)
# ------------------------------------------------------------
volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:
