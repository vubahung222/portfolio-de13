# ============================================================
#  Nginx reverse proxy for the Portfolio stack
#  - HTTP -> HTTPS redirect
#  - HTTPS (self-signed) with security headers
#  - PHP-FPM upstream (app container)
#  - phpMyAdmin proxied under /pma/
#  - /stub_status exposed internally for nginx-exporter
# ============================================================

# ---- Internal stub_status endpoint for Prometheus exporter --
server {
    listen 8080;
    server_name _;

    location /stub_status {
        stub_status;
        allow 172.16.0.0/12;   # docker networks only
        allow 127.0.0.1;
        deny all;
    }
}

# ---- HTTP: redirect everything to HTTPS -----------------------
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---- HTTPS: main site -----------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/html/public;
    index index.php index.html;

    # ---- Security headers ----
    add_header X-Frame-Options            "SAMEORIGIN"        always;
    add_header X-Content-Type-Options     "nosniff"           always;
    add_header Referrer-Policy            "no-referrer-when-downgrade" always;
    add_header X-XSS-Protection           "1; mode=block"     always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy     "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;
    server_tokens off;

    # ---- Static + PHP front controller ----
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param HTTPS on;
    }

    # ---- phpMyAdmin reverse proxy ----
    location /pma/ {
        proxy_pass http://phpmyadmin:80/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ---- Deny access to hidden files ----
    location ~ /\. {
        deny all;
    }
}
